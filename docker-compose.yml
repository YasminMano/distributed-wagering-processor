services:
  postgres:
    image: postgres:17-alpine
    container_name: wagering-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wagering}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wagering}
      POSTGRES_DB: ${POSTGRES_DB:-wagering}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wagering} -d ${POSTGRES_DB:-wagering}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  ministack:
    image: ministackorg/ministack:latest
    container_name: wagering-ministack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      MINISTACK_REGION: us-east-1
    volumes:
      - ./localstack/init:/etc/localstack/init
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data: